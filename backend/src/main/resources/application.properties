spring.application.name=abordo

# Puerto (en la nube lo define la variable PORT)
server.port=${PORT:8080}

# MongoDB: en local usa la base abordo; en la nube se pasa MONGODB_URI
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/abordo}
spring.data.mongodb.auto-index-creation=true

# JWT: en producción se pasa JWT_SECRET (mínimo 32 caracteres)
abordo.jwt.secreto=${JWT_SECRET:clave-de-desarrollo-abordo-cambiar-en-produccion-2026}
abordo.jwt.horas-validez=8

# Orígenes permitidos para el frontend (separados por coma)
abordo.cors.origenes=${CORS_ORIGENES:http://localhost:5173}

# Carga datos de prueba al iniciar si la base está vacía
abordo.datos-prueba=${DATOS_PRUEBA:true}

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
