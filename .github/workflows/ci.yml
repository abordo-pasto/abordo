name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn -B verify

  api:
    # Levanta MongoDB y el backend y corre la colección de Postman completa
    runs-on: ubuntu-latest
    needs: backend
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Compilar y arrancar el backend
        working-directory: backend
        run: |
          mvn -B -q package -DskipTests
          nohup java -jar target/abordo.jar > app.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8080/api/estado && break; sleep 2; done
      - name: Correr la colección de Postman
        run: npx --yes newman@6 run postman/Abordo.postman_collection.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
